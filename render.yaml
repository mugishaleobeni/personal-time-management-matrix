services:
  - type: web
    name: personal-time-management-matrix
    env: python
    buildCommand: pip install -r backend/requirements.txt && npm install && npm run build
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --chdir backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_NAME
        value: chronos_db
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Chronos OS
